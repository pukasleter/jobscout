name: Jobs sammeln

on:
  schedule:
    # 01:17 UTC = 03:17 Sommerzeit / 02:17 Winterzeit (Konstanz).
    # GitHub startet geplante Läufe oft Stunden zu spät (zur vollen Stunde am
    # schlimmsten) – deshalb früh und auf krummer Minute.
    - cron: "17 1 * * *"
  workflow_dispatch:        # manueller Start über "Run workflow"

permissions:
  contents: write           # damit der Lauf data/ committen darf

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collector ausführen
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collect.py

      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name  "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "jobs $(date -u +%F)"
          git pull --rebase --autostash
          git push
